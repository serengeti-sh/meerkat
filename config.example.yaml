app:
  name: meerkat
  env: development
  debug: true

http:
  host: 0.0.0.0
  port: 8080

store:
  driver: postgres
  host: localhost
  port: 5432
  name: meerkat
  user: meerkat
  password: meerkat
  sslmode: disable

datasources:
  - name: vm
    type: prometheus
    url: http://localhost:8428
  - name: vl
    type: victoria-logs
    url: http://localhost:9428
  # - name: prom
  #   type: prometheus
  #   url: http://localhost:9090
  # - name: loki
  #   type: loki
  #   url: http://localhost:3100

analyzer:
  # provider: openai (default) or anthropic
  # openai works with any OpenAI-compatible API:
  #   OpenAI, Ollama, vLLM, Groq, Together AI, Mistral, LiteLLM, etc.
  provider: openai
  url: https://api.openai.com
  api_key: ""
  model: gpt-4o
  max_iterations: 10
  max_tokens: 4096
  temperature: 0.3
  system_prompt_file: config/system_prompt.txt
  skills_file: config/skills.yaml

  # Anthropic example:
  # provider: anthropic
  # url: https://api.anthropic.com
  # api_key: ${ANTHROPIC_API_KEY}
  # model: claude-sonnet-4-20250514

  # Ollama example (uses openai provider):
  # provider: openai
  # url: http://localhost:11434
  # api_key: ""
  # model: llama3

scheduler:
  enabled: false
  jobs:
    - name: error-spike-check
      interval: 5m
      metric_query: "rate(http_errors_total[5m])"
      log_query: "level:error"
    - name: latency-check
      interval: 10m
      metric_query: "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))"
      log_query: ""

inspector:
  dedup_window: 5m

reporter:
  webhook_url: ""
  min_severity: warning
