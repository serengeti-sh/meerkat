app:
  name: meerkat
  env: development
  debug: true

http:
  host: 0.0.0.0
  port: 8080

store:
  driver: postgres
  host: localhost
  port: 5432
  name: meerkat
  user: meerkat
  password: meerkat
  sslmode: disable

tools:
  prometheus_description: "Query metrics using PromQL. Returns time series data."
  prometheus_param_schema_file: resources/schemas/prometheus.json
  prometheus:
    - name: vm
      url: http://localhost:8428
  victoria_logs_description: "Query logs using LogsQL. Returns log entries."
  victoria_logs_param_schema_file: resources/schemas/victorialogs.json
  victoria_logs:
    - name: vl
      url: http://localhost:9428
  # loki_description: "Query logs using LogQL. Returns log entries with timestamps and labels."
  # loki_param_schema_file: resources/schemas/loki.json
  # loki:
  #   - name: loki
  #     url: http://localhost:3100
  # For HTTPS connections with internal CA:
  # prometheus:
  #   - name: vm-tls
  #     url: https://victoriametrics-server:8428
  #     ca_file: /app/ca/ca.crt
  # custom:
  #   - name: my-api
  #     description: "Query my custom API for status information."
  #     url: http://my-api:8080/status
  #     method: GET
  #     param_schema_file: resources/schemas/my-api.json

analyzer:
  # provider: openai (default) or anthropic
  # openai works with any OpenAI-compatible API:
  #   OpenAI, Ollama, vLLM, Groq, Together AI, Mistral, LiteLLM, etc.
  provider: openai
  url: https://api.openai.com
  api_key: ""
  model: gpt-4o
  max_iterations: 10
  max_tokens: 4096
  temperature: 0.3
  system_prompt_file: config/system_prompt.txt
  skills_file: config/skills.yaml
  # max_retries: 3
  # retry_base_ms: 1000
  # max_tool_result_chars: 30000
  # summarize_on_overflow: true
  # max_context_messages: 50

  # Anthropic example:
  # provider: anthropic
  # url: https://api.anthropic.com
  # api_key: ${ANTHROPIC_API_KEY}
  # model: claude-sonnet-4-20250514

  # Ollama example (uses openai provider):
  # provider: openai
  # url: http://localhost:11434
  # api_key: ""
  # model: llama3

scheduler:
  enabled: false
  jobs:
    - name: error-spike-check
      interval: 5m
      metric_query: "rate(http_errors_total[5m])"
      log_query: "level:error"
    - name: latency-check
      interval: 10m
      metric_query: "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))"
      log_query: ""

inspector:
  dedup_window: 5m

reporter:
  webhook_url: ""
  min_severity: warning
