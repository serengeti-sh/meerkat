app:
  name: meerkat
  env: development
  debug: true

http:
  host: 0.0.0.0
  port: 8080

store:
  driver: postgres
  host: localhost
  port: 5432
  name: meerkat
  user: meerkat
  password: meerkat
  sslmode: disable

tools:
  # Descriptions and schema files are optional — sensible defaults are built in.
  # The Docker image includes default schemas at /app/internal/tool/schemas/.
  # Uncomment and modify to override defaults or use custom schemas.
  #
  # prometheus_description: "Query metrics using PromQL. Returns time series data."
  # prometheus_param_schema_file: internal/tool/schemas/prometheus.json
  prometheus:
    - name: vm
      url: http://localhost:8428

  # victoria_logs_description: "Query logs using LogsQL. Returns log entries."
  # victoria_logs_param_schema_file: internal/tool/schemas/victorialogs.json
  victoria_logs:
    - name: vl
      url: http://localhost:9428

  # loki_description: "Query logs using LogQL. Returns log entries with timestamps and labels."
  # loki_param_schema_file: internal/tool/schemas/loki.json
  # loki:
  #   - name: loki
  #     url: http://localhost:3100

  # For HTTPS connections with internal CA:
  # prometheus:
  #   - name: vm-tls
  #     url: https://victoriametrics-server:8428
  #     ca_file: /app/ca/ca.crt

  # Custom tools require description, url, method, and param_schema_file.
  # Unlike built-in tools, custom tools have NO defaults. The schema file
  # MUST exist at the specified path (mount it if running in Docker/K8s).
  # custom:
  #   - name: my-api
  #     description: "Query my custom API for status information."
  #     url: http://my-api:8080/status
  #     method: GET
  #     param_schema_file: /app/custom/schemas/my-api.json

analyzer:
  # provider: openai (default) or anthropic
  # openai works with any OpenAI-compatible API:
  #   OpenAI, Ollama, vLLM, Groq, Together AI, Mistral, LiteLLM, etc.
  provider: openai
  url: https://api.openai.com
  api_key: ""
  model: gpt-4o
  max_iterations: 10
  max_tokens: 4096
  temperature: 0.3
  system_prompt_file: config/system_prompt.txt
  skills_file: config/skills.yaml
  # max_retries: 3
  # retry_base_ms: 1000
  # max_tool_result_chars: 30000
  # summarize_on_overflow: true
  # max_context_messages: 50

  # Anthropic example:
  # provider: anthropic
  # url: https://api.anthropic.com
  # api_key: ${ANTHROPIC_API_KEY}
  # model: claude-sonnet-4-20250514

  # Ollama example (uses openai provider):
  # provider: openai
  # url: http://localhost:11434
  # api_key: ""
  # model: llama3

scheduler:
  enabled: false
  jobs:
    - name: error-spike-check
      interval: 5m
      metric_query: "rate(http_errors_total[5m])"
      log_query: "level:error"
    - name: latency-check
      interval: 10m
      metric_query: "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))"
      log_query: ""

inspector:
  dedup_window: 5m

reporter:
  webhook_url: ""
  min_severity: warning

collector:
  otlp_bind_addr: ":4317"
  batch_size: 100
  flush_interval: 5s

embedder:
  provider: openai
  api_key: ""
  base_url: ""
  model: text-embedding-3-small

vector_store:
  milvus:
    address: localhost:19530
    collection: logs
    dimension: 1536
    retention: 72h
    database: default
    auth:
      enabled: false
      # user: ""
      # password: ""
      # token: ""
    tls:
      enabled: false
      # ca_file: ""
      # skip_verify: false
