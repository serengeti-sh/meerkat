syntax = "proto3";

package meerkatlogs.v1;

option go_package = "github.com/serengeti-sh/meerkat/internal/meerkatlogspb";

import "google/protobuf/timestamp.proto";

// Service provides semantic search and context retrieval for AI analysis.
service Service {
  // Search finds semantically similar log entries.
  rpc Search(SearchRequest) returns (SearchResponse);

  // GetContext retrieves relevant log context for a given service and time range.
  rpc GetContext(GetContextRequest) returns (GetContextResponse);
}

// SearchResult represents a single matching log entry.
message SearchResult {
  string id = 1;
  float score = 2;
  string body = 3;
  string service = 4;
  string severity = 5;
  google.protobuf.Timestamp timestamp = 6;
}

// SearchRequest contains the query parameters.
message SearchRequest {
  string query = 1;
  int32 limit = 2;
  string service = 3;
  string severity = 4;
  int64 time_range_seconds = 5;
}

// SearchResponse returns the search results.
message SearchResponse {
  repeated SearchResult results = 1;
}

// GetContextRequest retrieves log context for a specific incident.
message GetContextRequest {
  string service = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  int32 limit = 4;
}

// GetContextResponse returns the contextual log entries.
message GetContextResponse {
  repeated SearchResult results = 1;
}
