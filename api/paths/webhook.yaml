/webhook/{source}:
  post:
    operationId: receiveWebhook
    summary: Receive a webhook trigger
    tags: [Webhook]
    parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ReceiveWebhookReq"
    responses:
      "202":
        description: Webhook accepted
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ReportResponse"
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
