/inspect:
  post:
    operationId: createInspect
    summary: Trigger a manual inspection
    tags: [Inspect]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CreateInspectReq"
    responses:
      "202":
        description: Inspection accepted
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ReportResponse"
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
