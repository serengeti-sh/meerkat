/datasources:
  get:
    operationId: listDatasources
    summary: List datasources
    tags: [Datasources]
    responses:
      "200":
        description: List of datasources
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/DatasourceResponse"
  post:
    operationId: createDatasource
    summary: Add a datasource
    tags: [Datasources]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CreateDatasourceRequest"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DatasourceResponse"
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

/datasources/{id}/test:
  get:
    operationId: testDatasource
    summary: Test datasource connection
    tags: [Datasources]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Connection OK
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
              required:
                - status
      default:
        description: Error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
