openapi: 3.0.3
info:
  title: Meerkat API
  version: 1.0.0
  description: AI-powered observability agent API

servers:
  - url: /v1

components:
  schemas:
    Error:
      $ref: "./schemas/common.yaml#/Error"

    ReportResponse:
      $ref: "./schemas/report.yaml#/ReportResponse"

    DatasourceResponse:
      $ref: "./schemas/datasource.yaml#/DatasourceResponse"
    CreateDatasourceRequest:
      $ref: "./schemas/datasource.yaml#/CreateDatasourceRequest"

    CreateInspectReq:
      $ref: "./schemas/inspect.yaml#/CreateInspectReq"

    ReceiveWebhookReq:
      $ref: "./schemas/webhook.yaml#/ReceiveWebhookReq"

paths:
  /health:
    $ref: "./paths/health.yaml#/~1health"

  /inspect:
    $ref: "./paths/inspect.yaml#/~1inspect"

  /webhook:
    $ref: "./paths/webhook.yaml#/~1webhook"

  /reports:
    $ref: "./paths/reports.yaml#/~1reports"
  /reports/{id}:
    $ref: "./paths/reports.yaml#/~1reports~1{id}"

  /datasources:
    $ref: "./paths/datasources.yaml#/~1datasources"
  /datasources/{id}/test:
    $ref: "./paths/datasources.yaml#/~1datasources~1{id}~1test"
