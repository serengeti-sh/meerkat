{{- if .Values.rag.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meerkat.fullname" . }}-rag
  labels:
    {{- include "meerkat.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag
spec:
  type: {{ .Values.rag.service.type }}
  ports:
    - port: {{ .Values.rag.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "meerkat.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rag
{{- end }}
