{{- if or .Values.secrets.database.password .Values.secrets.analyzer.apiKey .Values.secrets.reporter.webhookURL .Values.secrets.embedder.apiKey .Values.secrets.milvus.user .Values.secrets.milvus.password .Values.secrets.milvus.token -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meerkat.fullname" . }}
  labels:
    {{- include "meerkat.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-2"
type: Opaque
data:
  {{- if .Values.secrets.database.password }}
  database-password: {{ .Values.secrets.database.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.analyzer.apiKey }}
  analyzer-api-key: {{ .Values.secrets.analyzer.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.reporter.webhookURL }}
  reporter-webhook-url: {{ .Values.secrets.reporter.webhookURL | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.embedder.apiKey }}
  embedder-api-key: {{ .Values.secrets.embedder.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.milvus.user }}
  milvus-user: {{ .Values.secrets.milvus.user | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.milvus.password }}
  milvus-password: {{ .Values.secrets.milvus.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.milvus.token }}
  milvus-token: {{ .Values.secrets.milvus.token | b64enc | quote }}
  {{- end }}
{{- end }}
