apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meerkat.fullname" . }}-analyzer
  labels:
    {{- include "meerkat.labels" . | nindent 4 }}
    app.kubernetes.io/component: analyzer
spec:
  replicas: {{ .Values.analyzer.replicaCount }}
  selector:
    matchLabels:
      {{- include "meerkat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analyzer
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "meerkat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analyzer
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "meerkat.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "meerkat.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - analyzer
            - serve
            - --config
            - /app/config/config.yaml
          env:
            {{- if .Values.rag.enabled }}
            - name: RAG_ADDRESS
              value: {{ include "meerkat.fullname" . }}-rag:{{ .Values.rag.service.port }}
            {{- end }}
            {{- if or .Values.secrets.database.password .Values.secrets.database.existingSecret }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecret | default (include "meerkat.fullname" .) }}
                  key: {{ .Values.secrets.database.existingSecretKey | default "database-password" }}
            {{- end }}
            {{- if or .Values.secrets.analyzer.apiKey .Values.secrets.analyzer.existingSecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.analyzer.existingSecret | default (include "meerkat.fullname" .) }}
                  key: {{ .Values.secrets.analyzer.existingSecretKey | default "analyzer-api-key" }}
            {{- end }}
            {{- if or .Values.secrets.reporter.webhookURL .Values.secrets.reporter.existingSecret }}
            - name: REPORTER_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.reporter.existingSecret | default (include "meerkat.fullname" .) }}
                  key: {{ .Values.secrets.reporter.existingSecretKey | default "reporter-webhook-url" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.http.port }}
              protocol: TCP
          {{- with .Values.analyzer.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
            {{- if $.Values.analyzer.tls.server.enabled }}
            scheme: HTTPS
            {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.analyzer.livenessProbe | nindent 12 }}
            {{- if .Values.analyzer.tls.server.enabled }}
            scheme: HTTPS
            {{- end }}
          readinessProbe:
            {{- toYaml .Values.analyzer.readinessProbe | nindent 12 }}
            {{- if .Values.analyzer.tls.server.enabled }}
            scheme: HTTPS
            {{- end }}
          resources:
            {{- toYaml .Values.analyzer.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.analyzer.tls.server.enabled }}
            - name: server-tls
              mountPath: {{ .Values.analyzer.tls.server.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "meerkat.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.analyzer.tls.server.enabled }}
        - name: server-tls
          secret:
            secretName: {{ .Values.analyzer.tls.server.existingSecret }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
