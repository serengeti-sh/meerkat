apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "meerkat.fullname" . }}
  labels:
    {{- include "meerkat.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-1"
data:
  config.yaml: |
{{ .Values.config | toYaml | nindent 4 }}
  system_prompt.txt: |
{{ .Values.systemPrompt | nindent 4 }}
  {{- if .Values.skills }}
  skills.yaml: |
{{ .Values.skills | toYaml | nindent 4 }}
  {{- end }}
