# Default values for meerkat.

image:
  repository: ghcr.io/serengeti-sh/meerkat-server
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

# Analyzer server
analyzer:
  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: meerkat.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  httpRoute:
    enabled: false
    annotations: {}
    parentRefs: []
    hostnames: []
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  startupProbe:
    httpGet:
      path: /v1/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  livenessProbe:
    httpGet:
      path: /v1/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /v1/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  tls:
    server:
      enabled: false
      existingSecret: ""
      mountPath: /app/tls

# Vectors ingestion and search server (gRPC + OTLP)
vectors:
  enabled: false
  replicaCount: 1

  service:
    type: ClusterIP
    port: 50051
    otlpPort: 4317
    metricsPort: 9090

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  startupProbe:
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  livenessProbe:
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Node scheduling
nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables
extraEnv: []
extraEnvFrom: []

# Additional volume mounts and volumes
extraVolumeMounts: []
extraVolumes: []

# Application configuration
config:
  app:
    name: meerkat
    env: production
    debug: false

  http:
    host: "0.0.0.0"
    port: 8080

  store:
    driver: postgres
    host: ""
    port: 5432
    name: meerkat
    user: meerkat
    sslmode: disable

  tools:
    prometheus: []
    victoria_logs: []

  analyzer:
    provider: openai
    url: https://api.openai.com
    model: gpt-4o
    max_iterations: 10
    max_tokens: 4096
    temperature: 0.3
    system_prompt_file: /app/config/system_prompt.txt
    skills_file: /app/config/skills.yaml

  schedule:
    enabled: false
    jobs: []

  inspect:
    dedup_window: 5m

  notify:
    webhook_url: ""
    min_severity: warning

  vectors:
    enabled: false
    address: ":50051"
    otlp_bind_addr: ":4317"
    ingest_batch_size: 100
    similarity_threshold: 0.7
    max_context_logs: 20
    filter_mode: template
    min_severity: info
    deduplicate_by_template: true
    retention: 72h

  embed:
    provider: openai
    model: text-embedding-3-small

  vector_store:
    milvus:
      address: ""
      database: ""
      collection: logs
      dimension: 1536
      retention: 72h
      auth:
        enabled: false
        user: ""
        password: ""
        token: ""
      tls:
        enabled: false
        ca_file: ""
        skip_verify: false

# Secrets (passed as environment variables)
secrets:
  database:
    password: ""
    existingSecret: ""
    existingSecretKey: database-password
  analyzer:
    apiKey: ""
    existingSecret: ""
    existingSecretKey: analyzer-api-key
  notify:
    webhookURL: ""
    existingSecret: ""
    existingSecretKey: notify-webhook-url
  embed:
    apiKey: ""
    existingSecret: ""
    existingSecretKey: embed-api-key
  milvus:
    user: ""
    password: ""
    token: ""
    existingSecret: ""
    existingSecretKeyUser: milvus-user
    existingSecretKeyPassword: milvus-password
    existingSecretKeyToken: milvus-token

# System prompt content (rendered as /app/config/system_prompt.txt)
systemPrompt: |
  You are an SRE AI agent analyzing observability data for anomalies and issues.

  You have access to tools that query metrics and logs from observability data sources.
  Use them to gather data, then analyze it for:
  1. Anomalies, error spikes, latency increases, resource exhaustion
  2. Root cause hypotheses based on correlating metrics and logs
  3. Severity assessment: info, warning, or critical
  4. Recommended actions

  ## Log Context

  When the analysis context includes a "=== Recent Log Context ===" section,
  these are semantically similar log entries retrieved from the Vectors index.
  Use this context to:
  - Identify recurring error patterns and their frequency
  - Correlate log anomalies with metric alerts
  - Formulate more precise root cause hypotheses
  - Prioritize issues based on log severity distribution

  Do NOT treat Vectors context as a replacement for live datasource queries.
  Use it as supplementary evidence alongside current metrics and logs.

  ## Tool Usage Rules

  - When calling tools, use the EXACT tool name as provided in the tool list. Do NOT invent tool names.
  - Each tool has its own query language. Refer to the parameter schema for syntax examples:
    * victoriametrics (Prometheus): Uses PromQL. Examples: 'up', 'rate(http_requests_total[5m])', 'container_memory_usage_bytes{namespace="default"}'
    * victoria-logs (VictoriaLogs): Uses LogsQL. Examples: 'error', '_time:5m _stream:{k8s.namespace.name="default"} error', '_time:1h {app="nginx"} |~ "err.*"'
  - If a tool call fails (datasource unreachable, timeout, query error), do NOT guess or make assumptions.
    Instead, report the failure honestly and try alternative datasources if available.
  - If ALL datasources fail, set severity based on alert status:
    - "resolved" alert + no data → severity: "info", summary: "Alert resolved but verification blocked"
    - "firing" alert + no data → severity: "warning", summary: "Cannot confirm issue due to data access failure"

  ## Response Format

  When you have enough data to reach a conclusion, respond with a JSON analysis:
  {
    "severity": "info|warning|critical",
    "summary": "one-line summary",
    "detail": "detailed analysis with root cause and recommendations"
  }
  Do NOT include the JSON inside markdown code blocks. Respond with raw JSON only.

# Skills configuration (rendered as /app/config/skills.yaml)
skills: []

# Migration job settings (ArgoCD PreSync hook)
migration:
  enabled: true
