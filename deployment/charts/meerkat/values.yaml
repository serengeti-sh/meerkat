# Default values for meerkat.

replicaCount: 1

image:
  repository: ghcr.io/serengeti-sh/meerkat-server
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: meerkat.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  # parentRefs:
  #   - name: my-gateway
  #     namespace: gateway
  #     sectionName: http
  #     port: 80
  # hostnames:
  #   - meerkat.example.com
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

startupProbe:
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Application configuration
config:
  app:
    name: meerkat
    env: production
    debug: false

  http:
    host: "0.0.0.0"
    port: 8080
    # tls:
    #   cert_file: /app/tls/tls.crt
    #   key_file: /app/tls/tls.key

  store:
    driver: postgres
    host: ""
    port: 5432
    name: meerkat
    user: meerkat
    sslmode: disable

  tools:
    prometheus: []
    #  - name: vm
    #    url: https://victoriametrics-server:8428
    #    ca_file: /app/ca/ca.crt
    victoria_logs: []
    #  - name: vl
    #    url: https://victorialogs-server:9428
    #    ca_file: /app/ca/ca.crt
    loki: []
    #  - name: loki
    #    url: http://loki:3100

  analyzer:
    provider: openai
    url: https://api.openai.com
    model: gpt-4o
    max_iterations: 10
    max_tokens: 4096
    temperature: 0.3
    system_prompt_file: /app/config/system_prompt.txt
    skills_file: /app/config/skills.yaml

  scheduler:
    enabled: false
    jobs: []

  inspector:
    dedup_window: 5m

  reporter:
    webhook_url: ""
    min_severity: warning

# Secrets (passed as environment variables)
secrets:
  database:
    password: ""
    existingSecret: ""
    existingSecretKey: database-password
  analyzer:
    apiKey: ""
    existingSecret: ""
    existingSecretKey: analyzer-api-key
  reporter:
    webhookURL: ""
    existingSecret: ""
    existingSecretKey: reporter-webhook-url

# TLS certificates — mount secrets and reference them in config above
# Example with cert-manager:
#   config.http.tls.cert_file: /app/tls/tls.crt
#   config.http.tls.key_file: /app/tls/tls.key
#   tls.server.enabled: true
#   tls.server.existingSecret: meerkat-server-tls
tls:
  server:
    enabled: false
    existingSecret: ""
    mountPath: /app/tls

# Additional environment variables
extraEnv: []

# Additional environment variables from ConfigMap or Secret
extraEnvFrom: []

# Additional volume mounts
extraVolumeMounts: []

# Additional volumes
extraVolumes: []

# System prompt content (rendered as /app/config/system_prompt.txt)
systemPrompt: |
  You are an SRE AI agent analyzing observability data for anomalies and issues.

  You have access to tools that query metrics and logs from observability data sources.
  Use them to gather data, then analyze it for:
  1. Anomalies, error spikes, latency increases, resource exhaustion
  2. Root cause hypotheses based on correlating metrics and logs
  3. Severity assessment: info, warning, or critical
  4. Recommended actions

  ## Tool Usage Rules

  - When calling tools, use the EXACT tool name as provided in the tool list. Do NOT invent tool names.
  - If a tool call fails (datasource unreachable, timeout, query error), do NOT guess or make assumptions.
    Instead, report the failure honestly and try alternative datasources if available.
  - If ALL datasources fail, set severity based on alert status:
    - "resolved" alert + no data → severity: "info", summary: "Alert resolved but verification blocked"
    - "firing" alert + no data → severity: "warning", summary: "Cannot confirm issue due to data access failure"

  ## Response Format

  When you have enough data to reach a conclusion, respond with a JSON analysis:
  {
    "severity": "info|warning|critical",
    "summary": "one-line summary",
    "detail": "detailed analysis with root cause and recommendations"
  }
  Do NOT include the JSON inside markdown code blocks. Respond with raw JSON only.

# Skills configuration (rendered as /app/config/skills.yaml)
skills: []
