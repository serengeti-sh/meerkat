name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: "-buildvcs=false"

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.11.4
          install-only: true
      - name: Check formatting
        run: golangci-lint fmt --diff

  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: Download dependencies
        run: go mod download
      - name: Run go vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.11.4
          args: --timeout=5m

  unit-test:
    name: Unit Tests
    needs: [fmt-check, vet, lint]
    runs-on: dawn-cluster-dind
    env:
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests
        run: go test -v $(go list ./... | grep -v -e /mocks -e /test/integration -e /test/e2e -e /test/kind) --coverprofile cover-unit.out
      - name: Check coverage file
        run: ls -la ${{ github.workspace }}/cover-unit.out || echo "Coverage file not found"
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        if: success()
        with:
          files: ${{ github.workspace }}/cover-unit.out
          fail_ci_if_error: false

  build:
    name: Build
    needs: [unit-test]
    runs-on: dawn-cluster
    container:
      image: golang:1.26.3
    env:
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: Download dependencies
        run: go mod download
      - name: Build binaries
        run: |
          go build -o bin/meerkat ./cmd/meerkat
          go build -o bin/meerkat-server ./cmd/meerkat-server

  docker-build:
    name: Docker Build
    needs: [unit-test]
    runs-on: dawn-cluster-dind
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Build Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: build/docker/server.Dockerfile
          push: false
          tags: meerkat-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: build/docker/server.Dockerfile
          config: .hadolint.yaml

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0
      - name: Run ct lint
        run: ct lint --all --chart-dirs=deployment/charts
      - name: Helm Template
        run: helm template meerkat ./deployment/charts/meerkat

  openapi-validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Bundle OpenAPI spec
        run: npx @apidevtools/swagger-cli bundle api/openapi.yaml --outfile api/openapi.bundled.json --type json
      - name: Validate OpenAPI spec
        run: npx @apidevtools/swagger-cli validate api/openapi.bundled.json

  integration-test:
    name: Integration Tests
    needs: [build]
    runs-on: dawn-cluster-dind
    container:
      image: golang:1.26.3
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: Download dependencies
        run: go mod download
      - name: Run integration tests
        run: make test-integration
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        if: always()
        with:
          files: cover-integration.out
          fail_ci_if_error: false

  e2e-test:
    name: E2E Tests
    needs: [build]
    runs-on: dawn-cluster-dind
    container:
      image: golang:1.26.3
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: Download dependencies
        run: go mod download
      - name: Run e2e tests
        run: make test-e2e
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        if: always()
        with:
          files: cover-e2e.out
          fail_ci_if_error: false

  kind-test:
    name: Kind Cluster Test
    needs: [unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Install Kind
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true
      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.17.0
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0
      - name: Download dependencies
        run: go mod download
      - name: Run Kind tests
        run: go test -v ./test/kind/... -timeout 30m
