name: Pull Request

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v6.0.1
        if: always()
        with:
          files: cover-unit.out
          fail_ci_if_error: false

  golangci-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.11.4

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: build/docker/server.Dockerfile
          config: .hadolint.yaml

  docker-build:
    name: Docker Build
    needs: [unit-test, golangci-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: build/docker/server.Dockerfile
          push: false
          tags: meerkat-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run ct lint
        run: ct lint --all --chart-dirs=deployment/charts

      - name: Helm Template
        run: helm template meerkat ./deployment/charts/meerkat

  openapi-validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Bundle OpenAPI spec
        run: npx @apidevtools/swagger-cli bundle api/openapi.yaml --outfile api/openapi.bundled.json --type json

      - name: Validate OpenAPI spec
        run: npx @apidevtools/swagger-cli validate api/openapi.bundled.json

  integration-test:
    name: Integration Tests
    needs: [unit-test, golangci-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: make test-integration

      - name: Upload coverage
        uses: codecov/codecov-action@v6.0.1
        if: always()
        with:
          files: cover-integration.out
          fail_ci_if_error: false

  e2e-test:
    name: E2E Tests
    needs: [unit-test, golangci-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"

      - name: Download dependencies
        run: go mod download

      - name: Run e2e tests
        run: make test-e2e

      - name: Upload coverage
        uses: codecov/codecov-action@v6.0.1
        if: always()
        with:
          files: cover-e2e.out
          fail_ci_if_error: false

  trivy-scan:
    name: Trivy Security Scan
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build Docker image for scan
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: build/docker/server.Dockerfile
          push: false
          load: true
          tags: meerkat-server:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: meerkat-server:scan
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  deploy-test:
    name: Deploy Test
    needs: [docker-build, helm-lint, trivy-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"

      - name: Download dependencies
        run: go mod download

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: build/docker/server.Dockerfile
          push: false
          load: true
          tags: meerkat-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Kind
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true

      - name: Run deployment test
        run: make test-deploy

  goreleaser-check:
    name: GoReleaser Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.1"

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v7.2.2
        with:
          version: "~> v2"
          args: check
