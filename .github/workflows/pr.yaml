name: Pull Request

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.1"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v6.0.0
        if: always()
        with:
          files: cover-unit.out
          fail_ci_if_error: false

  golangci-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.1"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4

  docker-test:
    name: Docker Test
    needs: [unit-test, golangci-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: build/docker/server.Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: build/docker/server.Dockerfile
          push: false
          tags: meerkat-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
