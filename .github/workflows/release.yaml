name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  docker-build:
    name: Build and Push Docker Images
    uses: serengeti-sh/workflows/.github/workflows/docker-build.yml@main
    with:
      images: |
        [
          {"name": "server", "dockerfile": "server.Dockerfile"}
        ]

      registry: ${{ vars.REGISTRY }}
      repository: ${{ vars.REPOSITORY }}

      tag: ${{ github.ref_name }}
      tag-prefix: "v"

      base-path: "build/docker"
      platforms: "linux/amd64"

      enable-provenance: false
      enable-sbom: false

    secrets:
      registry-username: ${{ secrets.REGISTRY_USERNAME }}
      registry-password: ${{ secrets.REGISTRY_PASSWORD }}

  goreleaser:
    name: Release CLI and Server Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.1"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.0.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
