version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: meerkat
    main: ./cmd/meerkat
    binary: meerkat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwi
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: meerkat-server
    main: ./cmd/meerkat-server
    binary: meerkat-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: meerkat
    ids:
      - meerkat
    name_template: "meerkat_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

  - id: meerkat-server
    ids:
      - meerkat-server
    name_template: "meerkat-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  gitea:
    owner: serengeti-sh
    name: meerkat
  draft: false
  prerelease: auto

gitea_urls:
  api: https://git.mandacode.com/api/v1
  download: https://git.mandacode.com
